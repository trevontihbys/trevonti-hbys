<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Trevonti HBYS — Healthcare OS. 5 ürün, 62+ modül, FHIR R5, IEC 62304, HIPAA, GDPR, FDA SaMD, EU MDR, WCAG 2.1 AA.">
  <title>Trevonti HBYS — Healthcare OS</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
    html{scroll-behavior:smooth}
    body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#fff;color:#1e293b;overflow-x:hidden}
    a{text-decoration:none;color:inherit}
    :root{
      --teal:#0d9488;--teal-dark:#0b7a71;--teal-light:#f0fdf4;
      --navy:#0f172a;--slate:#1e293b;--gray:#64748b;--lgray:#f1f5f9;
      --white:#fff;--grad:linear-gradient(135deg,#0f172a 0%,#0d3a3a 50%,#0d9488 100%);
    }
    .nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(15,23,42,.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.06);padding:0 5%;height:64px;display:flex;align-items:center;justify-content:space-between;transition:.3s}
    .nav-logo{display:flex;align-items:center}
    .nav-logo-text-group{display:flex;flex-direction:column;line-height:1.2}
    .nav-logo-main{display:flex;align-items:baseline;gap:6px}
    .nav-logo-trevonti{font-weight:800;font-size:17px;color:#fff;letter-spacing:.5px}
    .nav-logo-hbys{font-weight:700;font-size:17px;color:var(--teal);letter-spacing:1px}
    .nav-logo-subtitle{font-size:9px;font-weight:600;color:#fff;opacity:.9;letter-spacing:.3px;white-space:nowrap}
    .nav-logo-tech{font-size:7.5px;font-weight:400;color:rgba(255,255,255,.6);white-space:nowrap;letter-spacing:.2px;margin-top:2px}
    .nav-links{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .nav-links a{color:rgba(255,255,255,.7);font-size:11px;font-weight:500;transition:.2s;white-space:nowrap}
    .nav-links a:hover{color:#fff}
    .nav-cta{background:var(--teal);color:#fff!important;padding:6px 14px;border-radius:8px;font-weight:600!important;font-size:11px!important;transition:.2s!important}
    .nav-cta:hover{background:var(--teal-dark)!important}
    .nav-menu-btn{display:none;background:none;border:none;cursor:pointer;color:#fff;font-size:22px}
    .lang-dropdown{position:relative;margin-left:6px}
    .lang-dropdown-btn{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;padding:5px 9px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:500;display:flex;align-items:center;gap:4px;transition:all .2s}
    .lang-dropdown-btn:hover{background:rgba(255,255,255,.1);border-color:var(--teal)}
    .lang-dropdown-btn i{font-size:8px;opacity:.7}
    .lang-dropdown-menu{position:absolute;top:100%;right:0;margin-top:8px;background:#1e293b;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:6px 0;min-width:140px;max-height:280px;overflow-y:auto;box-shadow:0 8px 20px rgba(0,0,0,.3);display:none;z-index:200}
    .lang-dropdown-menu.show{display:block}
    .lang-option{padding:7px 12px;color:rgba(255,255,255,.8);font-size:11px;cursor:pointer;transition:background .2s;white-space:nowrap}
    .lang-option:hover{background:rgba(13,148,136,.2);color:#fff}
    .lang-option.active{background:var(--teal);color:#fff}
    .hero{min-height:100vh;background:var(--grad);display:flex;align-items:center;padding:100px 5% 60px;position:relative;overflow:hidden}
    .hero-bg-dots{position:absolute;inset:0;background-image:radial-gradient(rgba(13,148,136,.15) 1px,transparent 1px);background-size:32px 32px;pointer-events:none}
    .hero-glow{position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(13,148,136,.2) 0%,transparent 70%);top:-100px;right:-100px;pointer-events:none}
    .hero-content{position:relative;max-width:640px}
    .hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(13,148,136,.2);border:1px solid rgba(13,148,136,.4);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;color:#5eead4;margin-bottom:24px}
    .hero-badge-dot{width:6px;height:6px;border-radius:50%;background:#5eead4;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .hero-title{font-size:clamp(32px,5vw,56px);font-weight:800;color:#fff;line-height:1.15;margin-bottom:20px}
    .hero-title span{color:#5eead4}
    .hero-sub{font-size:18px;color:rgba(255,255,255,.7);line-height:1.7;margin-bottom:32px;max-width:520px}
    .hero-btns{display:flex;gap:12px;flex-wrap:wrap}
    .btn-pri{padding:14px 28px;background:var(--teal);color:#fff;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:.2s;border:none;display:inline-flex;align-items:center;gap:8px}
    .btn-pri:hover{background:var(--teal-dark);transform:translateY(-1px)}
    .btn-sec{padding:14px 28px;background:rgba(255,255,255,.08);color:#fff;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s;border:1px solid rgba(255,255,255,.15);display:inline-flex;align-items:center;gap:8px}
    .btn-sec:hover{background:rgba(255,255,255,.14)}
    .hero-stats{display:flex;gap:32px;margin-top:48px;flex-wrap:wrap}
    .hs-item{text-align:left}.hs-val{font-size:32px;font-weight:800;color:#fff}.hs-label{font-size:13px;color:rgba(255,255,255,.55);margin-top:2px}
    .hero-right{position:absolute;right:5%;top:50%;transform:translateY(-50%);width:min(42%,480px);display:flex;flex-direction:column;gap:10px;pointer-events:none}
    .hr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;animation:floatIn .6s ease both}
    @keyframes floatIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
    .hr-card:nth-child(1){animation-delay:.1s}.hr-card:nth-child(2){animation-delay:.2s}.hr-card:nth-child(3){animation-delay:.3s}.hr-card:nth-child(4){animation-delay:.4s}
    .hr-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
    .hr-info{flex:1}.hr-title{font-size:13px;font-weight:600;color:#fff}.hr-sub{font-size:11px;color:rgba(255,255,255,.5);margin-top:1px}
    .hr-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px;white-space:nowrap}
    .hb-green{background:rgba(34,197,94,.2);color:#4ade80}.hb-teal{background:rgba(13,148,136,.25);color:#5eead4}.hb-blue{background:rgba(59,130,246,.2);color:#60a5fa}.hb-amber{background:rgba(245,158,11,.2);color:#fcd34d}
    section{padding:80px 5%}
    .section-badge{display:inline-block;background:var(--teal-light);color:var(--teal);font-size:12px;font-weight:700;padding:5px 14px;border-radius:20px;margin-bottom:14px}
    .section-title{font-size:clamp(26px,3.5vw,40px);font-weight:800;color:var(--navy);line-height:1.25;margin-bottom:14px}
    .section-title span{color:var(--teal)}
    .section-sub{font-size:17px;color:var(--gray);line-height:1.7;max-width:680px;margin-bottom:40px}
    .center{text-align:center}.center .section-sub{margin:0 auto 40px}
    .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
    .grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
    .grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:24px;transition:.2s}
    .card:hover{border-color:var(--teal);transform:translateY(-3px);box-shadow:0 8px 24px rgba(13,148,136,.1)}
    .card-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:14px}
    .card-title{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:8px}
    .card-desc{font-size:13px;color:var(--gray);line-height:1.6}
    .fi-teal{background:#f0fdf4}.fi-blue{background:#eff6ff}.fi-purple{background:#f5f3ff}.fi-amber{background:#fffbeb}.fi-red{background:#fef2f2}.fi-green{background:#f0fdf4}.fi-slate{background:#f1f5f9}.fi-cyan{background:#ecfeff}
    .prob-card{background:#fff;border:1px solid #fee2e2;border-radius:14px;padding:24px;position:relative;overflow:hidden}
    .prob-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:#ef4444}
    .prob-icon{font-size:28px;margin-bottom:12px}.prob-title{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:8px}.prob-desc{font-size:13px;color:var(--gray);line-height:1.6}.prob-stat{font-size:22px;font-weight:800;color:#dc2626;margin-top:10px}
    .plat-card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:28px 20px;text-align:center;transition:.25s}
    .plat-card:hover{border-color:var(--teal);transform:translateY(-4px);box-shadow:0 12px 30px rgba(13,148,136,.12)}
    .plat-icon{font-size:42px;margin-bottom:16px}.plat-name{font-size:17px;font-weight:800;color:var(--navy);margin-bottom:8px}
    .plat-desc{font-size:13px;color:var(--gray);line-height:1.5;margin-bottom:12px}
    .plat-stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
    .plat-stat{font-size:10px;font-weight:600;color:var(--teal);background:var(--teal-light);padding:4px 9px;border-radius:6px}
    .faz-card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:22px 16px;text-align:center;transition:.2s}
    .faz-card:hover{border-color:var(--teal);transform:translateY(-3px)}
    .faz-num{font-size:36px;font-weight:900;color:var(--teal);opacity:.25;margin-bottom:6px}
    .faz-title{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:8px}
    .faz-desc{font-size:11px;color:var(--gray);line-height:1.5}
    .faz-vizyon{font-size:10px;color:var(--teal);font-style:italic;margin-top:4px}
    .xfact-card{background:linear-gradient(135deg,#0f172a,#0d3a3a);border:1px solid rgba(13,148,136,.3);border-radius:16px;padding:28px 20px;text-align:center;color:#fff;transition:.25s}
    .xfact-card:hover{border-color:#5eead4;transform:translateY(-4px);box-shadow:0 12px 30px rgba(13,148,136,.25)}
    .xfact-icon{font-size:44px;margin-bottom:14px}.xfact-title{font-size:16px;font-weight:700;margin-bottom:8px}.xfact-desc{font-size:12px;color:rgba(255,255,255,.65);line-height:1.5}
    .mod-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .mod-item{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:12px;display:flex;align-items:center;gap:8px;transition:.15s;flex-wrap:wrap}
    .mod-item:hover{border-color:var(--teal);background:var(--teal-light)}
    .mod-icon{font-size:18px;flex-shrink:0}.mod-name{font-size:12px;font-weight:500;color:var(--slate);flex:1}.mod-kpi{font-size:9px;color:var(--gray);width:100%;font-style:italic}
    .new-badge,.planned-badge{font-size:7px;font-weight:700;padding:2px 5px;border-radius:4px;white-space:nowrap}
    .new-badge{background:var(--teal);color:#fff}.planned-badge{background:#f59e0b;color:#fff}
    .integ-bg{background:var(--navy)}
    .integ-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
    .integ-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:20px;text-align:center;transition:.2s}
    .integ-card:hover{background:rgba(255,255,255,.1);border-color:rgba(13,148,136,.4)}
    .ic-icon{font-size:32px;margin-bottom:10px}.ic-name{font-size:14px;font-weight:600;color:#fff;margin-bottom:4px}.ic-desc{font-size:12px;color:rgba(255,255,255,.5)}
    .ic-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;margin-top:8px;background:rgba(34,197,94,.2);color:#4ade80}
    .ai-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
    .ai-card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:28px;position:relative;overflow:hidden}
    .ai-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
    .ai-teal::before{background:var(--teal)}.ai-blue::before{background:#3b82f6}.ai-purple::before{background:#8b5cf6}.ai-amber::before{background:#f59e0b}
    .ai-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
    .ai-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px}
    .ai-title{font-size:16px;font-weight:700;color:var(--navy)}.ai-algo{font-size:12px;color:var(--gray);margin-top:2px}
    .ai-metric{display:flex;align-items:center;gap:16px;margin-bottom:12px}
    .am-val{font-size:40px;font-weight:800;color:var(--teal);line-height:1}
    .am-label{font-size:12px;color:var(--gray)}.am-ci{font-size:11px;color:var(--gray);font-family:'Consolas',monospace}
    .ai-desc{font-size:13px;color:var(--gray);line-height:1.6}
    .stack-item{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px;text-align:center;transition:.15s}
    .stack-item:hover{border-color:var(--teal);transform:translateY(-2px)}
    .si-icon{font-size:22px;margin-bottom:5px}.si-name{font-size:11px;font-weight:600;color:var(--slate)}.si-type{font-size:9px;color:var(--gray);margin-top:2px}
    .arch-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:20px}
    .arch-layer{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;text-align:center}
    .arch-layer-icon{font-size:22px;margin-bottom:5px}.arch-layer-name{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:4px}.arch-layer-tech{font-size:9px;color:var(--gray);line-height:1.5}
    .roadmap-bg{background:var(--navy)}
    .roadmap-line{display:grid;grid-template-columns:repeat(6,1fr);gap:0;position:relative}
    .roadmap-line::before{content:'';position:absolute;top:22px;left:8%;right:8%;height:2px;background:rgba(255,255,255,.1);z-index:0}
    .rm-item{text-align:center;position:relative;z-index:1;padding:0 4px}
    .rm-dot{width:36px;height:36px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;border:3px solid}
    .rm-done{background:var(--teal);border-color:var(--teal);color:#fff}
    .rm-active{background:#0f172a;border-color:var(--teal);color:var(--teal);animation:glowPulse 2s infinite}
    @keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 rgba(13,148,136,.4)}50%{box-shadow:0 0 0 8px rgba(13,148,136,0)}}
    .rm-quarter{font-size:8px;font-weight:700;color:var(--teal);margin-bottom:2px}
    .rm-title{font-size:10px;font-weight:600;color:#fff;margin-bottom:3px}.rm-desc{font-size:8px;color:rgba(255,255,255,.5);line-height:1.3}
    .cta-bg{background:linear-gradient(135deg,var(--teal-dark),#0891b2)}
    .cta-inner{display:flex;align-items:center;justify-content:space-between;gap:32px;flex-wrap:wrap}
    .cta-title{font-size:clamp(22px,3vw,36px);font-weight:800;color:#fff;margin-bottom:10px}
    .cta-sub{font-size:16px;color:rgba(255,255,255,.8);max-width:480px}
    .cta-btns{display:flex;gap:10px;flex-wrap:wrap;flex-shrink:0}
    .cta-btn-white{padding:13px 26px;background:#fff;color:var(--teal);border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:none;transition:.2s}
    .cta-btn-white:hover{background:#f0fdf4}
    .cta-btn-outline{padding:13px 26px;background:transparent;color:#fff;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:2px solid rgba(255,255,255,.4);transition:.2s}
    .cta-btn-outline:hover{border-color:#fff;background:rgba(255,255,255,.08)}
    .footer{background:var(--navy);padding:60px 5% 30px}
    .footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:40px;margin-bottom:40px}
    .footer-logo{display:flex;align-items:center;gap:10px;margin-bottom:16px}
    .fl-box{width:34px;height:34px;background:var(--teal);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px}
    .fl-name{color:#fff;font-size:16px;font-weight:700}
    .footer-desc{font-size:13px;color:rgba(255,255,255,.5);line-height:1.7;margin-bottom:20px}
    .footer-links-title{font-size:11px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
    .footer-links a{display:block;font-size:12px;color:rgba(255,255,255,.6);margin-bottom:6px;transition:.2s}
    .footer-links a:hover{color:#fff}
    .footer-bottom{border-top:1px solid rgba(255,255,255,.08);padding-top:24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
    .fb-copy{font-size:11px;color:rgba(255,255,255,.4)}
    .fb-badges{display:flex;gap:8px;flex-wrap:wrap}
    .fb-badge{font-size:10px;font-weight:600;padding:4px 9px;border-radius:8px;background:rgba(13,148,136,.2);color:var(--teal)}
    .fade-in{opacity:0;transform:translateY(20px);transition:opacity .6s,transform .6s}
    .fade-in.visible{opacity:1;transform:none}
    @media(max-width:1024px){.hero-right{display:none}.grid4,.mod-grid{grid-template-columns:repeat(3,1fr)}.grid6{grid-template-columns:repeat(4,1fr)}.arch-grid{grid-template-columns:repeat(3,1fr)}.footer-grid{grid-template-columns:1fr 1fr}.roadmap-line{grid-template-columns:repeat(3,1fr)}.roadmap-line::before{display:none}.grid5{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:768px){.nav-links{display:none}.nav-menu-btn{display:block}.grid3,.grid4,.ai-grid{grid-template-columns:1fr}.mod-grid,.integ-grid{grid-template-columns:repeat(2,1fr)}.grid6{grid-template-columns:repeat(3,1fr)}.arch-grid{grid-template-columns:repeat(2,1fr)}.roadmap-line{grid-template-columns:repeat(2,1fr);gap:12px}.roadmap-line::before{display:none}.footer-grid{grid-template-columns:1fr}.cta-inner{flex-direction:column}.hero-stats{gap:20px}.grid5{grid-template-columns:repeat(2,1fr)}.nav-logo-trevonti,.nav-logo-hbys{font-size:15px!important}.hero{padding-top:120px;padding-bottom:80px}.hero-content{max-width:100%}.hero-stats{justify-content:space-between}.hs-item{flex:1;text-align:center}section{padding:60px 5%}.footer-bottom{flex-direction:column;align-items:flex-start}.lang-dropdown-menu{right:auto;left:0}}
    @media(max-width:480px){.mod-grid,.integ-grid,.grid6{grid-template-columns:repeat(2,1fr)}.arch-grid{grid-template-columns:1fr}.grid4,.grid3,.ai-grid,.grid5{grid-template-columns:1fr}}
  
/* ═══════════════════════════════════════════════════════════════════════════
   READABILITY FIX — Dark section text visibility
   Targets: navy bg sections, integ-bg, roadmap-bg
   ═══════════════════════════════════════════════════════════════════════════ */

/* Section headers inside ANY navy/dark background */
[style*="background:var(--navy)"] .section-title,
.integ-bg .section-title,
.roadmap-bg .section-title {
  color: #fff !important;
}
[style*="background:var(--navy)"] .section-sub,
.integ-bg .section-sub,
.roadmap-bg .section-sub {
  color: rgba(255,255,255,.72) !important;
}
[style*="background:var(--navy)"] .section-badge,
.integ-bg .section-badge,
.roadmap-bg .section-badge {
  background: rgba(13,148,136,.22) !important;
  color: #5eead4 !important;
}
[style*="background:var(--navy)"] .section-title span,
.integ-bg .section-title span,
.roadmap-bg .section-title span {
  color: #5eead4 !important;
}

/* Roadmap: rm-title and rm-desc on navy bg */
.roadmap-bg .rm-title { color: #fff !important; }
.roadmap-bg .rm-desc  { color: rgba(255,255,255,.65) !important; }
.roadmap-bg .rm-quarter { color: #5eead4 !important; }
.roadmap-bg .rm-active { background: rgba(13,148,136,.12) !important; }

/* Platform cards — ensure text is always visible */
.plat-name { color: #0f172a !important; }
.plat-desc  { color: #475569 !important; }
.plat-stat  { color: #0d9488 !important; background: #f0fdf4 !important; }

/* Module items — white bg, always dark text */
.mod-name   { color: #1e293b !important; }
.mod-kpi    { color: #64748b !important; }

/* FAZ cards — white bg */
.faz-title  { color: #0f172a !important; }
.faz-desc   { color: #64748b !important; }
.faz-vizyon { color: #0d9488 !important; }

/* Features cards — white bg */
.card-title { color: #0f172a !important; }
.card-desc  { color: #475569 !important; }

function TI(section, subkey) {
  const lang = localStorage.getItem('pref-lang') || 'tr';
  const base = T()[section];
  if (!base) return [];
  const items = subkey ? base[subkey] : (base.items || []);
  if (!items) return [];
  if (lang === 'tr' || lang === 'en') return items;
  const trans = ITEM_TRANS[lang] && ITEM_TRANS[lang][section];
  if (!trans) return items;
  return items.map((item, i) => trans[i] ? Object.assign({}, item, trans[i]) : item);
}

// ── BUILD FUNCTIONS ───────────────────────────────────────────────────────────
function buildSection(id, items, template) {
  const c = document.getElementById(id);
  if (!c) return;
  c.innerHTML = items.map(template).join('');
}

function buildFeatures() {
  buildSection('features-container', TI('features'), x =>
    `<div class="card"><div class="card-icon ${x.cls}">${x.icon}</div><div class="card-title">${x.title}</div><div class="card-desc">${x.desc}</div></div>`);
}

function buildPlatform() {
  buildSection('platform-container', TI('platform','products'), x =>
    `<div class="plat-card"><div class="plat-icon">${x.icon}</div><div class="plat-name">${x.name}</div><div class="plat-desc">${x.desc}</div><div class="plat-stats">${x.stats.map(s=>`<span class="plat-stat">${s}</span>`).join('')}</div></div>`);
}

function buildModules() {
  const m = T().modules;
  buildSection('mod-container', m.items, (x, i) => {
    const isNew = (i >= 31 && i <= 45) || i >= 55;
    const isSoon = i >= 46 && i <= 54;
    let badgeHtml = '', cls = '';
    if (isNew) { badgeHtml = `<span class="new-badge">${m.b_new}</span>`; cls = 'new-highlight'; }
    else if (isSoon) { badgeHtml = `<span class="planned-badge">${m.b_soon}</span>`; cls = 'planned-highlight'; }
    return `<div class="mod-item ${cls}"><span class="mod-icon">${x.icon}</span><span class="mod-name">${x.name}</span>${badgeHtml}<span class="mod-kpi">${x.kpi}</span></div>`;
  });
}

function switchLanguage(lang) {
  localStorage.setItem('pref-lang', lang);
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    const val = key.split('.').reduce((o, k) => o?.[k], T());
    if (val) el.innerHTML = val;
  });
  document.querySelectorAll('.lang-option').forEach(o => o.classList.toggle('active', o.dataset.lang === lang));
  document.getElementById('currentLangDisplay').textContent = { tr:'TR',en:'EN',de:'DE',fr:'FR',es:'ES',pt:'PT',it:'IT',ar:'AR',zh:'ZH',ja:'JA',ko:'KO' }[lang] || lang.toUpperCase();
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.documentElement.lang = lang;
  document.getElementById('langDropdownMenu').classList.remove('show');
  refreshAll();
}

document.addEventListener('DOMContentLoaded', () => {
  const sl = localStorage.getItem('pref-lang') || 'tr';
  switchLanguage(sl);
  document.getElementById('langDropdownBtn').addEventListener('click', e => { e.stopPropagation(); document.getElementById('langDropdownMenu').classList.toggle('show'); });
  document.querySelectorAll('.lang-option').forEach(o => o.addEventListener('click', e => switchLanguage(o.dataset.lang)));
  document.addEventListener('click', () => document.getElementById('langDropdownMenu').classList.remove('show'));
  document.querySelectorAll('.fade-in').forEach(el => new IntersectionObserver(e => e.forEach(x => { if (x.isIntersecting) x.target.classList.add('visible'); }), { threshold: 0.1 }).observe(el));
  setTimeout(() => {
    [{ id: 'count-modules', t: 62, s: '+', d: 1600 }, { id: 'count-demos', t: 49, s: '', d: 1400 }, { id: 'count-sprints', t: 28, s: '', d: 1200 }].forEach(c => {
      const el = document.getElementById(c.id); if (!el) return; let st = null;
      const step = ts => { if (!st) st = ts; const p = Math.min((ts - st) / c.d, 1); el.textContent = Math.round((1 - Math.pow(1 - p, 3)) * c.t) + c.s; if (p < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    });
  }, 300);
});

function toggleMenu() {
  const l = document.getElementById('navLinks');
  if (l.style.display === 'flex') { l.style.display = 'none'; }
  else { l.style.display = 'flex'; l.style.flexDirection = 'column'; l.style.position = 'absolute'; l.style.top = '64px'; l.style.left = '0'; l.style.right = '0'; l.style.background = '#0f172a'; l.style.padding = '20px'; l.style.gap = '16px'; }
}
